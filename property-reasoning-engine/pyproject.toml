[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "property-reasoning-engine"
version = "0.1.0"
description = "A shared ReasoningEngine client for Vertex AI Agent Engine"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "you@example.com"},
]
requires-python = ">=3.10"
dependencies = [
    "google-cloud-aiplatform",
    "python-dotenv",
    "vertexai",
]

[tool.setuptools.packages.find]
where = ["src"]
