[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphql-microservice"
version = "0.1.0"
dependencies = [
    "strawberry-graphql[asgi]",
    "uvicorn",
    "python-dotenv",
    "google-cloud-aiplatform",
    "motor>=3.3.0",
    "pymongo>=4.6.0",
    "pydantic>=2.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
